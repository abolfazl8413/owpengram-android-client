name: Build Telegram APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code with Submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build APK via Docker
        run: |
          docker build -t owpengram-builder .
          docker run --rm -v ${{ github.workspace }}:/home/source owpengram-builder

      - name: Locate Output APK
        run: |
          echo "=== Found APKs ==="
          find . -name "*.apk" -ls

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OwpenGram-Android-APK
          path: |
            TMessagesProj/build/outputs/apk/**/*.apk
            TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          retention-days: 14
